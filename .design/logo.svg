<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- DinkyTags logo. Rounded-square field (the one element shared across this author's
     Joomla extensions, e.g. dinkymetrics / dinkygallery / sitesnap; colour and
     pictogram are otherwise free), a graphite field with a single brass label / tag:
     sharp point to the top-right the way a price tag hangs, a punched hole below the
     point, and a small dark < > cut into the body so the physical "tag" also reads as
     a markup tag - which is what the plugin writes. The < > stays upright while the
     tag is tilted, like level print on a swinging label. See mark.svg for the reduced
     small-size version. -->
<svg width="100%" height="100%" viewBox="0 0 1080 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;">
    <g transform="translate(540,540) scale(5.4)">
        <rect x="-90" y="-90" width="180" height="180" rx="34" style="fill:rgb(27,35,44);"/>
        <g transform="translate(6,-5) rotate(42)">
            <path d="M-24 -14 L0 -47 L24 -14 L24 32 Q24 38 18 38 L-18 38 Q-24 38 -24 32 Z" style="fill:rgb(224,161,61);"/>
            <circle cx="0" cy="-31" r="6" style="fill:rgb(27,35,44);"/>
        </g>
        <g transform="translate(1,2)" style="fill:none;stroke:rgb(27,35,44);stroke-width:5.5px;">
            <path d="M-4 -11 L-16 0 L-4 11"/>
            <path d="M6 -11 L18 0 L6 11"/>
        </g>
    </g>
</svg>
