PLG_SYSTEM_DINKYTAGS="System - Dinky Tags"
PLG_SYSTEM_DINKYTAGS_XML_DESCRIPTION="Emits Open Graph and Twitter Card meta tags for articles, categories, the home page and other frontend pages. Dependency-free, configured entirely through the parameters below."

PLG_SYSTEM_DINKYTAGS_FIELDSET_BASIC="Tags"
PLG_SYSTEM_DINKYTAGS_FIELDSET_ADVANCED="Advanced"

PLG_SYSTEM_DINKYTAGS_PARAM_ENABLED_VIEWS_LABEL="Handle these views"
PLG_SYSTEM_DINKYTAGS_PARAM_ENABLED_VIEWS_DESC="Only the ticked frontend contexts get Open Graph / Twitter tags. Untick one to leave those pages exactly as they are now."
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_ARTICLE="Single articles"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_CATEGORY="Category blog / list"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_FEATURED="Featured articles"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_HOME="Home page"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_OTHER="Any other page"

PLG_SYSTEM_DINKYTAGS_PARAM_DEFAULT_IMAGE_LABEL="Default image"
PLG_SYSTEM_DINKYTAGS_PARAM_DEFAULT_IMAGE_DESC="Site-wide fallback share image, used whenever a page has no image of its own. Ideally 1200x630 px. Leave empty to emit no og:image rather than a placeholder."
PLG_SYSTEM_DINKYTAGS_PARAM_HOME_IMAGE_LABEL="Home page image"
PLG_SYSTEM_DINKYTAGS_PARAM_HOME_IMAGE_DESC="Overrides the default image on the home page only."

PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_LABEL="Article description from"
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_DESC="Which text to prefer for og:description / twitter:description on single articles."
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_METADESC="Meta description, then intro text"
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_INTROTEXT="Intro text, then meta description"

PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_LENGTH_LABEL="Description length"
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_LENGTH_DESC="Maximum length of a generated description, in characters. The text is cut on a word boundary and an ellipsis is appended."

PLG_SYSTEM_DINKYTAGS_PARAM_IMAGE_CUSTOM_FIELD_LABEL="Image custom field"
PLG_SYSTEM_DINKYTAGS_PARAM_IMAGE_CUSTOM_FIELD_DESC="Name (not label) of a com_content custom field holding a media path or URL. Checked after the article intro/full images and before the first inline image. Leave empty to skip."

PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_ARTICLE_META_LABEL="Emit article:* tags"
PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_ARTICLE_META_DESC="On single articles, also emit article:published_time, article:modified_time, article:section, article:tag and article:author."

PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_TWITTER_LABEL="Emit Twitter Card tags"
PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_TWITTER_DESC="Add the twitter:* block. twitter:card is summary_large_image when the resolved image is at least 300 px wide, otherwise summary."

PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_SITE_LABEL="twitter:site"
PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_SITE_DESC="The site's X/Twitter handle, including the leading @."
PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_CREATOR_LABEL="twitter:creator"
PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_CREATOR_DESC="Default author handle, including the leading @."

PLG_SYSTEM_DINKYTAGS_PARAM_FB_APP_ID_LABEL="fb:app_id"
PLG_SYSTEM_DINKYTAGS_PARAM_FB_APP_ID_DESC="Facebook application ID. Emitted as fb:app_id when set."

PLG_SYSTEM_DINKYTAGS_PARAM_OG_LOCALE_LABEL="og:locale"
PLG_SYSTEM_DINKYTAGS_PARAM_OG_LOCALE_DESC="Use 'auto' to derive it from the active site language (e.g. de-DE becomes de_DE), or enter an explicit value such as de_DE."

PLG_SYSTEM_DINKYTAGS_PARAM_OVERRIDE_MODE_LABEL="When a tag already exists"
PLG_SYSTEM_DINKYTAGS_PARAM_OVERRIDE_MODE_DESC="'Only if missing' leaves any og:title / og:description / og:image already set by another extension untouched. 'Always' overwrites them."
PLG_SYSTEM_DINKYTAGS_PARAM_OVERRIDE_MODE_ONLY_IF_MISSING="Only if missing"
PLG_SYSTEM_DINKYTAGS_PARAM_OVERRIDE_MODE_ALWAYS="Always overwrite"

PLG_SYSTEM_DINKYTAGS_PARAM_FALLBACK_TO_LOGO_LABEL="Last-resort logo image"
PLG_SYSTEM_DINKYTAGS_PARAM_FALLBACK_TO_LOGO_DESC="If a page has no image and no default image is set, use the site logo as og:image. Off by default - better no image than the wrong one."

PLG_SYSTEM_DINKYTAGS_PARAM_STRIP_QUERY_PARAMS_LABEL="Strip query parameters"
PLG_SYSTEM_DINKYTAGS_PARAM_STRIP_QUERY_PARAMS_DESC="Comma-separated list of query-string keys removed from og:url (tracking parameters etc.)."

PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_COMPONENTS_LABEL="Excluded components"
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_COMPONENTS_DESC="Comma-separated list of component names (option values, e.g. com_icagenda) for which the plugin emits nothing, because they produce their own social meta."

PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_MENU_ITEMS_LABEL="Excluded menu items"
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_MENU_ITEMS_DESC="Menu items on which the plugin emits nothing."

PLG_SYSTEM_DINKYTAGS_PARAM_DEBUG_LABEL="Debug comment"
PLG_SYSTEM_DINKYTAGS_PARAM_DEBUG_DESC="Emit an HTML comment in the page head listing every decision the plugin made. For diagnostics only - turn off in production."
