PLG_SYSTEM_DINKYTAGS="System - DinkyTags"
PLG_SYSTEM_DINKYTAGS_XML_DESCRIPTION="Erzeugt Open-Graph- und Twitter-Card-Meta-Tags für Beiträge, Kategorien, die Startseite und weitere Frontend-Seiten. Ohne Abhängigkeiten, vollständig über die folgenden Parameter konfigurierbar."

PLG_SYSTEM_DINKYTAGS_PARAM_ENABLED_VIEWS_LABEL="Diese Ansichten behandeln"
PLG_SYSTEM_DINKYTAGS_PARAM_ENABLED_VIEWS_DESC="Nur die angehakten Frontend-Kontexte erhalten Open-Graph-/Twitter-Tags. Haken entfernen, um die betreffenden Seiten unverändert zu lassen."
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_ARTICLE="Einzelbeiträge"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_CATEGORY="Kategorie-Blog / -Liste"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_FEATURED="Hervorgehobene Beiträge"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_HOME="Startseite"
PLG_SYSTEM_DINKYTAGS_PARAM_VIEW_OTHER="Alle übrigen Seiten"

PLG_SYSTEM_DINKYTAGS_PARAM_DEFAULT_IMAGE_LABEL="Standardbild"
PLG_SYSTEM_DINKYTAGS_PARAM_DEFAULT_IMAGE_DESC="Websiteweites Ausweichbild für das Teilen, wird verwendet, wenn eine Seite kein eigenes Bild hat. Idealerweise 1200x630 px. Leer lassen, um lieber kein og:image als einen Platzhalter auszugeben."
PLG_SYSTEM_DINKYTAGS_PARAM_HOME_IMAGE_LABEL="Bild der Startseite"
PLG_SYSTEM_DINKYTAGS_PARAM_HOME_IMAGE_DESC="Überschreibt das Standardbild ausschließlich auf der Startseite."

PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_LABEL="Beitragsbeschreibung aus"
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_DESC="Welcher Text für og:description / twitter:description bei Einzelbeiträgen verwendet wird. Der jeweils andere dient als Ausweichquelle, wenn der gewählte Text leer ist."
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_METADESC="Meta-Beschreibung zuerst"
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_SOURCE_INTROTEXT="Einleitungstext zuerst"

PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_LENGTH_LABEL="Länge der Beschreibung"
PLG_SYSTEM_DINKYTAGS_PARAM_DESCRIPTION_LENGTH_DESC="Maximale Länge einer erzeugten Beschreibung in Zeichen. Der Text wird an einer Wortgrenze abgeschnitten und mit einem Auslassungszeichen ergänzt."

PLG_SYSTEM_DINKYTAGS_PARAM_IMAGE_CUSTOM_FIELD_LABEL="Benutzerdefiniertes Bildfeld"
PLG_SYSTEM_DINKYTAGS_PARAM_IMAGE_CUSTOM_FIELD_DESC="Name (nicht Beschriftung) eines com_content-Feldes mit einem Medienpfad oder einer URL. Wird nach dem Einleitungs-/Beitragsbild und vor dem ersten eingebetteten Bild geprüft. Leer lassen, um es zu überspringen."

PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_ARTICLE_META_LABEL="article:*-Tags ausgeben"
PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_ARTICLE_META_DESC="Bei Einzelbeiträgen zusätzlich article:published_time, article:modified_time, article:section, article:tag und article:author ausgeben."

PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_TWITTER_LABEL="Twitter-Card-Tags ausgeben"
PLG_SYSTEM_DINKYTAGS_PARAM_EMIT_TWITTER_DESC="Den twitter:*-Block hinzufügen. twitter:card ist summary_large_image, wenn das ermittelte Bild mindestens 300 px breit ist, sonst summary."

PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_SITE_LABEL="twitter:site"
PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_SITE_DESC="Der X-/Twitter-Name der Website, einschließlich des führenden @."
PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_CREATOR_LABEL="twitter:creator"
PLG_SYSTEM_DINKYTAGS_PARAM_TWITTER_CREATOR_DESC="Standard-Autorenname, einschließlich des führenden @."

PLG_SYSTEM_DINKYTAGS_PARAM_FB_APP_ID_LABEL="fb:app_id"
PLG_SYSTEM_DINKYTAGS_PARAM_FB_APP_ID_DESC="Facebook-Anwendungs-ID. Wird als fb:app_id ausgegeben, wenn gesetzt."

PLG_SYSTEM_DINKYTAGS_PARAM_OG_LOCALE_LABEL="og:locale"
PLG_SYSTEM_DINKYTAGS_PARAM_OG_LOCALE_DESC="Auf 'auto' belassen (Standard) - dann wird der Wert aus der aktiven Sprache abgeleitet, z. B. de-DE zu de_DE. Nur zum Überschreiben einen festen Wert wie de_DE eintragen."

PLG_SYSTEM_DINKYTAGS_PARAM_OVERRIDE_MODE_LABEL="Vorhandene Tags überschreiben"
PLG_SYSTEM_DINKYTAGS_PARAM_OVERRIDE_MODE_DESC="Wenn eine andere Erweiterung bereits einen Open-Graph-Tag wie og:title, og:description, og:image, og:site_name oder og:locale auf der Seite gesetzt hat, durch den DinkyTags-Wert ersetzen. Aus (Standard): Vorhandenes so lassen und nur die fehlenden Tags ergänzen."

PLG_SYSTEM_DINKYTAGS_PARAM_FALLBACK_TO_LOGO_LABEL="Logo als letztes Ausweichbild"
PLG_SYSTEM_DINKYTAGS_PARAM_FALLBACK_TO_LOGO_DESC="Wenn eine Seite kein Bild hat und kein Standardbild gesetzt ist, das Website-Logo als og:image verwenden. Standardmäßig aus - lieber kein Bild als das falsche."

PLG_SYSTEM_DINKYTAGS_PARAM_STRIP_QUERY_PARAMS_ENABLE_LABEL="Query-Parameter entfernen"
PLG_SYSTEM_DINKYTAGS_PARAM_STRIP_QUERY_PARAMS_ENABLE_DESC="Die unten aufgeführten Query-String-Schlüssel aus og:url entfernen. Standardmäßig an. Ausschalten, um og:url unverändert zu lassen - das Leeren des Listenfeldes genügt nicht, eine geleerte Liste fällt auf den Standard zurück."
PLG_SYSTEM_DINKYTAGS_PARAM_STRIP_QUERY_PARAMS_LABEL="Zu entfernende Parameter"
PLG_SYSTEM_DINKYTAGS_PARAM_STRIP_QUERY_PARAMS_DESC="Kommagetrennte Liste von Query-String-Schlüsseln, die aus og:url entfernt werden (Tracking-Parameter usw.)."

PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDE_COMPONENTS_ENABLE_LABEL="Bestimmte Komponenten überspringen"
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDE_COMPONENTS_ENABLE_DESC="Auf Seiten der unten aufgeführten Komponenten nichts ausgeben. Standardmäßig an (für com_icagenda, das eigene Social-Meta-Tags erzeugt). Ausschalten, damit DinkyTags jede Komponente behandelt - das Leeren des Listenfeldes genügt nicht, eine geleerte Liste fällt auf den Standard zurück."
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_COMPONENTS_LABEL="Zu überspringende Komponenten"
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_COMPONENTS_DESC="Kommagetrennte Liste von Komponentennamen (option-Werte, z. B. com_icagenda), für die das Plugin nichts ausgibt, weil sie eigene Social-Meta-Tags erzeugen."

PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_MENU_ITEMS_LABEL="Zu überspringende Menüeinträge"
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_MENU_ITEMS_DESC="Auswahl aus den Menüeinträgen der Website. Seiten, deren aktiver Menüeintrag in dieser Liste steht, erhalten keine Open-Graph-/Twitter-Tags von DinkyTags."
PLG_SYSTEM_DINKYTAGS_PARAM_EXCLUDED_MENU_ITEMS_HINT="Menüeinträge auswählen …"

PLG_SYSTEM_DINKYTAGS_PARAM_DEBUG_LABEL="Debug-Kommentar"
PLG_SYSTEM_DINKYTAGS_PARAM_DEBUG_DESC="Gibt im Seitenkopf einen HTML-Kommentar mit jeder Entscheidung des Plugins aus. Nur zur Diagnose - in der Produktion ausschalten."
